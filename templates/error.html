{% extends "base.html" %}
{% block title %}{{ code }} - Tharik Forum{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 640px; margin: 3rem auto;">
  <div class="card-body text-center py-5">
    <div class="display-4 fw-bold text-primary mb-3">{{ code }}</div>
    <h1 class="h4">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('home') if user else url_for('login') }}">{{ 'Back to home' if user else 'Back to login' }}</a>
  </div>
</div>
{% endblock %}
